<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <div class="contenedor">
        <div class="contenedor1">
            <form class="formulario" action=" formulario accesible">
                <label for="nombre">Nombre</label><br>
                <input type="text" placeholder="What should we call you?" id="nombre" name="nombre" required>
                <br><br>
                <label for="correo">Correo</label><br>
                <input type="email" placeholder="Example@gmail.com?" id="correo" name="correo" required>
                <br><br>
                <label for="contraseña">Ingresa una contraseña</label><br>
                <input type="password" placeholder="xxxxxxx" id="contraseña" name="contraseña" required>
                <button type="button" onclick="Ojito()">👁</button>
                <br><br>
                <label for="conf-contra">Confirmar contraseña</label><br>
                <input type="password" placeholder="xxxxxxx" id="conf-contra" name="conf-contra" required>
                <button type="button" onclick="Ojito()">👁</button>
                <br><br>
                <button class="Boton-EnviarF" type="submit">Enviar formulario</button>
                <br><br>
            </form>
        </div>
        <div class="contenedor2">
            <div class="circulo">
                <p>75%</p>
            </div>
            <p>profile completeness</p>
            <br>
            <div class="contenedor-componentes">
                <p>Create Account</p>
                <p>Update Readmap Progress</p>
                <p>Setup Public Profile</p>
                <p>Complete your first project</p>
                <p>Invite your Friends</p>
            </div>
        </div>


    </div>

</body>

</html>
